<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Адмін-панель — Jolly House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Nunito:wght@300;400;600;700;800&subset=cyrillic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

<div class="admin-top">
  <div class="container">
    <div style="display:flex;align-items:center">
      <span class="logo">Jólly.<small>HOUSE</small></span>
      <h1>Адмін-панель товарів</h1>
    </div>
    <a href="index.html" class="btn small outline plain" style="color:#fff;border-color:#fff">← На сайт</a>
  </div>
</div>

<main class="container admin-main">

  <div class="stats" id="stats"></div>

  <div class="admin-tools">
    <input type="text" id="aSearch" placeholder="Пошук за назвою або брендом…">
    <select id="aCat">
      <option value="all">Усі категорії</option>
      <option value="clothing">Одяг</option>
      <option value="footwear">Взуття</option>
      <option value="accessories">Аксесуари</option>
    </select>
    <button class="btn small" id="addBtn">Додати товар</button>
    <button class="ibtn" id="exportBtn">Експорт JSON</button>
    <button class="ibtn" id="importBtn">Імпорт JSON</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    <button class="ibtn danger" id="resetBtn">Скинути до початкових</button>
  </div>

  <h2 class="sec-title">Товари</h2>
  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr><th>ID</th><th>Фото</th><th>Назва</th><th>Бренд</th><th>Категорія</th><th>Стать</th><th>Розмір</th><th>Колір</th><th>Матеріал</th><th>Ціна</th><th>Дії</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <h2 class="sec-title" style="margin-top:50px">Замовлення <span id="ordCount" class="pill"></span></h2>
  <div class="table-wrap">
    <table class="data">
      <thead><tr><th>№</th><th>Дата</th><th>Клієнт</th><th>Доставка / оплата</th><th>Товари</th><th>Сума</th><th>Статус</th><th>Дії</th></tr></thead>
      <tbody id="ordBody"></tbody>
    </table>
  </div>
</main>

<!-- Форма додавання / редагування -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <button class="close" id="formClose" aria-label="Закрити">×</button>
    <form class="form-modal" id="pForm" novalidate>
      <h2 id="formTitle">Новий товар</h2>
      <div class="form-grid">
        <div class="full">
          <label for="pName">Назва *</label>
          <input type="text" id="pName" required>
        </div>
        <div>
          <label for="pBrand">Бренд *</label>
          <input type="text" id="pBrand" required>
        </div>
        <div>
          <label for="pCat">Категорія *</label>
          <select id="pCat">
            <option value="clothing">Одяг</option>
            <option value="footwear">Взуття</option>
            <option value="accessories">Аксесуари</option>
          </select>
        </div>
        <div>
          <label for="pGender">Стать *</label>
          <select id="pGender">
            <option value="men">Чоловічий</option>
            <option value="women">Жіночий</option>
          </select>
        </div>
        <div>
          <label for="pPrice">Ціна, грн *</label>
          <input type="number" id="pPrice" min="0" step="1" required>
        </div>
        <div>
          <label for="pSizes">Розміри * <span class="hint">(через кому)</span></label>
          <input type="text" id="pSizes" placeholder="S, M, L або 38, 39, 40">
        </div>
        <div>
          <label for="pColor">Колір *</label>
          <input type="text" id="pColor" placeholder="Black">
        </div>
        <div>
          <label for="pMaterial">Матеріал *</label>
          <input type="text" id="pMaterial" placeholder="Cotton">
        </div>
        <div class="full">
          <label for="pImage">Фото * <span class="hint">(посилання https://… або ID фото з Unsplash)</span></label>
          <input type="text" id="pImage" placeholder="https://…">
        </div>
        <div class="full" style="display:flex;gap:16px;align-items:flex-start">
          <img class="preview" id="pPreview" alt="Попередній перегляд">
          <div style="flex:1">
            <label for="pFile">…або завантажте файл з комп'ютера</label>
            <input type="file" id="pFile" accept="image/*">
            <div class="hint">Зображення зменшується та зберігається в браузері.</div>
          </div>
        </div>
        <div class="full">
          <label for="pDesc">Опис</label>
          <textarea id="pDesc" rows="3"></textarea>
        </div>
      </div>
      <div class="err" id="formErr"></div>
      <div class="form-actions">
        <button type="button" class="ibtn" id="formCancel">Скасувати</button>
        <button type="submit" class="btn small plain">Зберегти</button>
      </div>
    </form>
  </div>
</div>

<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/dropdown.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
